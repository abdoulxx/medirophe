server {
    listen 80;
    server_name 169.58.78.224;

    client_max_body_size 20M;

    location /static/ {
        alias /app/staticfiles/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        # Remplace (n'ajoute pas à) une éventuelle valeur envoyée par le
        # client : seul nginx (un seul hop, pas de CDN devant) peut fixer
        # cette valeur, donc apps/audit/services.py peut lui faire confiance
        # sans qu'un client puisse usurper son IP dans le journal d'audit.
        proxy_set_header X-Forwarded-For $remote_addr;
        # Toujours "http" pour l'instant (pas de TLS devant nginx) — voir
        # DJANGO_SECURE_SSL_REDIRECT dans DEPLOY.md. À passer à "https" (et
        # ajouter `listen 443 ssl`) une fois le certificat en place.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
