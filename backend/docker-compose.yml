services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medirophe}
      POSTGRES_USER: ${POSTGRES_USER:-medirophe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medirophe}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Assemblée ici (pas dans .env) pour n'avoir les identifiants Postgres
      # qu'à un seul endroit : les POSTGRES_* ci-dessus.
      DATABASE_URL: postgres://${POSTGRES_USER:-medirophe}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-medirophe}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_files:/app/staticfiles
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro

volumes:
  postgres_data:
  static_files:
